* {

}

body {

.contact-item a {

.contact-item a:hover {
  text-decoration: underline;
}

/* FOOTER */
.site-footer {

}

.footer-links span {
  color: #444;
}

.site-footer p {
  font-size: 13px;
  color: #777;
}

/* RESPONSIVE */
@media (max-width: 768px) {
  header {
    padding: 20px;
